version: '3.9'

services:

  # ── Database ────────────────────────────────────────────────────
  db:
    image: postgres
    environment: 
      - POSTGRES_DB: skuumate_db
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD: postgres

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skuumate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skuumate_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - .:/app           # Live reload in dev
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      python manage.py runserver 0.0.0.0:8000

  # ── Adminer — DB GUI for dev ──────────────────────────────────
  adminer:
    image: adminer
    container_name: skuumate_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
  redis_data:
  media_files:
  static_files: