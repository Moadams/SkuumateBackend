services:

  # --- MySQL Database ---
  db:
    image: mysql:8.0
    container_name: skuumate_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skuumate_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - cache_data:/app/cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  media_files:
  static_files:
  cache_data:
