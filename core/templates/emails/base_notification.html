<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f4f6fb;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #1a1a2e;
    }

    .wrapper {
      max-width: 620px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .header {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      padding: 36px 48px;
      text-align: center;
    }

    .header .logo {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .header .logo span {
      color: #93c5fd;
    }

    .header .tagline {
      color: #bfdbfe;
      font-size: 13px;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .body {
      padding: 40px 48px;
    }

    .body h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .body .message {
      font-size: 15px;
      color: #374151;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .body .message p {
      margin-bottom: 16px;
    }

    .footer {
      background: #f9fafb;
      border-top: 1px solid #f3f4f6;
      padding: 28px 48px;
      text-align: center;
    }

    .footer .powered-by {
      font-size: 11px;
      color: #9ca3af;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .footer .powered-by strong {
      color: #6b7280;
    }

    .footer .brand {
      font-size: 16px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .footer p {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.7;
      margin-bottom: 4px;
    }

    .footer p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    
    <div class="body">
      {% if title %}
      <h1>{{ title }}</h1>
      {% endif %}
      <div class="message">{{ body|safe }}</div>
    </div>

    <div class="footer">
      <div class="brand">SkuuMate</div>
      <p>This email was sent via the SkuuMate School Management System.</p>
      <p>&copy; {{ current_year }} SkuuMate by HubTek Primex Enterprise. All rights reserved.</p>
      <div class="powered-by">Powered by <strong>SkuuMate</strong></div>
    </div>

  </div>
</body>
</html>
